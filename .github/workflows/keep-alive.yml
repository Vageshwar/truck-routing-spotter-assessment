# The backend runs on Render's free tier, which sleeps after 15 minutes
# without traffic. Pinging it every 10 minutes keeps it awake for reviewers.
# (GitHub may run scheduled jobs a few minutes late; the frontend shows a
# "waking up" screen if the server did fall asleep.)
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 120 "${{ vars.BACKEND_URL }}/api/health"
